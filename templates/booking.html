{% extends "base.html" %}
{% block title %}Booking | OurHome{% endblock %}

{% block content %}
<section class="form-layout">
  <div class="form-intro">
    <span class="eyebrow">Booking</span>
    <h1>Book food donation slot</h1>
    <p>Enter orphanage name, location, date, and meal slot.</p>
  </div>
  <form class="panel stacked-form" method="POST">
    <label>Orphanage name<input name="name" required></label>
    <label>Location<input name="location" required></label>
    <label>Date<input type="date" name="date" required></label>
    <label>Slot<select name="slot"><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select></label>
    <label>Notes<textarea name="notes" rows="4"></textarea></label>
    <button class="button button-primary" type="submit">Book slot</button>
  </form>
</section>
{% endblock %}
