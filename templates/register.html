<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | OurHome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <section class="auth-hero single-auth">
    <form class="auth-card" method="POST">
      <span class="brand auth-brand"><span class="brand-mark">O</span><span>OurHome</span></span>
      <h2>Register</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <label>Name<input name="name" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Mobile number<input name="mobile" required></label>
      <label>Location<input name="location" required></label>
      <label>Password<input type="password" name="password" minlength="8" required></label>
      <button class="button button-primary" type="submit">Register</button>
      <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </form>
  </section>
</body>
</html>
