<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | OurHome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <section class="auth-hero single-auth">
    <form class="auth-card" method="POST">
      <span class="brand auth-brand"><span class="brand-mark">O</span><span>OurHome</span></span>
      <h2>Create new password</h2>
      <p>Use at least 8 characters.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <label>New password<input type="password" name="password" minlength="8" required></label>
      <button class="button button-primary" type="submit">Update password</button>
    </form>
  </section>
</body>
</html>
